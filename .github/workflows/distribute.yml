name: Distribute

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > vaultly-release.jks
          echo "VAULTLY_STORE_FILE=$PWD/vaultly-release.jks" >> $GITHUB_ENV
          echo "VAULTLY_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "VAULTLY_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "VAULTLY_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vaultly-release
          path: app/build/outputs/apk/release/*.apk

      - name: Firebase App Distribution
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: "Vaultly build ${{ github.sha }}"
